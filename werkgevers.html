<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werkgevers Portal - CV Database</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #fff;
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-box h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .login-box .subtitle {
            color: #2ec4b6;
            margin-bottom: 30px;
        }

        .login-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 14px 20px;
            color: #fff;
            font-size: 16px;
            margin-bottom: 16px;
        }

        .login-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .login-input:focus {
            outline: none;
            border-color: #2ec4b6;
        }

        .login-btn {
            width: 100%;
            background: #2ec4b6;
            border: none;
            border-radius: 8px;
            padding: 14px 24px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            background: #26a69a;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .login-error.show {
            display: block;
        }

        /* Portal */
        .portal {
            display: none;
        }

        .portal.active {
            display: block;
        }

        .header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .company-badge {
            background: rgba(46, 196, 182, 0.2);
            color: #2ec4b6;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .payment-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
        }

        .payment-status.paid {
            background: rgba(46, 196, 182, 0.2);
            color: #2ec4b6;
        }

        .payment-status.unpaid {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.2);
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            color: #ef4444;
            font-size: 13px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Search Section */
        .search-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .search-title {
            font-size: 16px;
            margin-bottom: 16px;
            color: rgba(255, 255, 255, 0.8);
        }

        .search-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 12px;
        }

        .search-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .search-input:focus {
            outline: none;
            border-color: #2ec4b6;
        }

        .search-btn {
            background: #2ec4b6;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: #26a69a;
        }

        /* Results */
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .results-count {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        /* CV Grid */
        .cv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .cv-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .cv-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .cv-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .cv-title {
            font-size: 14px;
            color: #2ec4b6;
            margin-bottom: 16px;
        }

        .cv-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .cv-info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        .cv-info-item.locked {
            color: rgba(255, 255, 255, 0.4);
        }

        .cv-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }

        .skill-tag {
            background: rgba(102, 126, 234, 0.2);
            color: #a5b4fc;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
        }

        .cv-summary {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.5;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .cv-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn-view {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
        }

        .btn-view:hover {
            background: rgba(102, 126, 234, 0.3);
        }

        .btn-download {
            background: rgba(46, 196, 182, 0.2);
            color: #2ec4b6;
        }

        .btn-download:hover {
            background: rgba(46, 196, 182, 0.3);
        }

        .btn-locked {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }

        .cv-file-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-bottom: 12px;
        }

        /* Upgrade Banner */
        .upgrade-banner {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(245, 158, 11, 0.2));
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upgrade-banner.hidden {
            display: none;
        }

        .upgrade-text h3 {
            color: #fbbf24;
            margin-bottom: 4px;
        }

        .upgrade-text p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .upgrade-btn {
            background: #fbbf24;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .upgrade-btn:hover {
            background: #f59e0b;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 28px;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #fff;
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .modal-section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #2ec4b6;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .modal-section-content {
            background: rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .locked-content {
            text-align: center;
            padding: 30px;
            color: rgba(255, 255, 255, 0.5);
        }

        .locked-content .lock-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: rgba(255, 255, 255, 0.6);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #2ec4b6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.5);
        }

        .empty-state h2 {
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.8);
        }

        @media (max-width: 768px) {
            .search-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 16px;
            }

            .cv-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h1>Werkgevers Portal</h1>
            <p class="subtitle">Vind de perfecte kandidaat</p>
            <div class="login-error" id="loginError">Ongeldige inloggegevens</div>
            <form id="loginForm">
                <input type="text" class="login-input" id="usernameInput" placeholder="Gebruikersnaam" required>
                <input type="password" class="login-input" id="passwordInput" placeholder="Wachtwoord" required>
                <button type="submit" class="login-btn" id="loginBtn">Inloggen</button>
            </form>
        </div>
    </div>

    <!-- Portal -->
    <div class="portal" id="portal">
        <header class="header">
            <div class="header-left">
                <h1>CV Database</h1>
                <span class="company-badge" id="companyName">Bedrijf</span>
            </div>
            <div class="header-right">
                <span class="payment-status" id="paymentStatus">Status</span>
                <button class="logout-btn" onclick="logout()">Uitloggen</button>
            </div>
        </header>

        <div class="container">
            <!-- Upgrade Banner (for unpaid users) -->
            <div class="upgrade-banner" id="upgradeBanner">
                <div class="upgrade-text">
                    <h3>Upgrade naar Premium</h3>
                    <p>Krijg toegang tot contactgegevens, volledige namen en werkervaring van alle kandidaten.</p>
                </div>
                <button class="upgrade-btn">Upgrade Nu</button>
            </div>

            <!-- Search Section -->
            <div class="search-section">
                <div class="search-title">Zoek kandidaten</div>
                <div class="search-grid">
                    <input type="text" class="search-input" id="searchInput" placeholder="Zoek op naam, vaardigheden, functie...">
                    <input type="text" class="search-input" id="jobTitleInput" placeholder="Functietitel">
                    <input type="text" class="search-input" id="locationInput" placeholder="Locatie/Regio">
                    <button class="search-btn" onclick="searchCVs()">Zoeken</button>
                </div>
            </div>

            <!-- Results -->
            <div class="results-header">
                <span class="results-count" id="resultsCount">0 kandidaten gevonden</span>
            </div>

            <div id="cvList" class="cv-grid">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>CV's laden...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal" id="cvModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalName">CV Details</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        let authToken = localStorage.getItem('employerToken');
        let hasPaid = false;
        let allCVs = [];

        // Check auth on load
        async function checkAuth() {
            if (!authToken) {
                showLogin();
                return;
            }

            try {
                const response = await fetch('/api/employer/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: authToken })
                });

                const result = await response.json();
                if (response.ok) {
                    hasPaid = result.hasPaid;
                    showPortal();
                } else {
                    localStorage.removeItem('employerToken');
                    authToken = null;
                    showLogin();
                }
            } catch (error) {
                showLogin();
            }
        }

        function showLogin() {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('portal').classList.remove('active');
        }

        function showPortal() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('portal').classList.add('active');
            updatePaymentUI();
            searchCVs();
        }

        function updatePaymentUI() {
            const statusEl = document.getElementById('paymentStatus');
            const bannerEl = document.getElementById('upgradeBanner');

            if (hasPaid) {
                statusEl.textContent = 'Premium';
                statusEl.className = 'payment-status paid';
                bannerEl.classList.add('hidden');
            } else {
                statusEl.textContent = 'Gratis account';
                statusEl.className = 'payment-status unpaid';
                bannerEl.classList.remove('hidden');
            }
        }

        // Login form
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value;
            const password = document.getElementById('passwordInput').value;
            const loginBtn = document.getElementById('loginBtn');
            const loginError = document.getElementById('loginError');

            loginBtn.disabled = true;
            loginBtn.textContent = 'Bezig...';
            loginError.classList.remove('show');

            try {
                const response = await fetch('/api/employer/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (result.success) {
                    authToken = result.token;
                    hasPaid = result.employer.hasPaid;
                    localStorage.setItem('employerToken', authToken);
                    document.getElementById('companyName').textContent = result.employer.companyName;
                    showPortal();
                } else {
                    loginError.textContent = result.message || 'Ongeldige inloggegevens';
                    loginError.classList.add('show');
                }
            } catch (error) {
                loginError.textContent = 'Verbindingsfout';
                loginError.classList.add('show');
            }

            loginBtn.disabled = false;
            loginBtn.textContent = 'Inloggen';
        });

        function logout() {
            localStorage.removeItem('employerToken');
            authToken = null;
            document.getElementById('usernameInput').value = '';
            document.getElementById('passwordInput').value = '';
            showLogin();
        }

        async function searchCVs() {
            const cvList = document.getElementById('cvList');
            cvList.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Zoeken...</p>
                </div>
            `;

            const search = document.getElementById('searchInput').value;
            const jobTitle = document.getElementById('jobTitleInput').value;
            const location = document.getElementById('locationInput').value;

            const params = new URLSearchParams();
            if (search) params.append('search', search);
            if (jobTitle) params.append('jobTitle', jobTitle);
            if (location) params.append('location', location);

            try {
                const response = await fetch(`/api/employer/cvs?${params}`, {
                    headers: { 'X-Employer-Token': authToken }
                });

                if (response.status === 401) {
                    logout();
                    return;
                }

                const result = await response.json();

                if (result.success) {
                    allCVs = result.data;
                    hasPaid = result.hasPaid;
                    updatePaymentUI();
                    renderCVs(allCVs);
                    document.getElementById('resultsCount').textContent = `${result.count} kandidaten gevonden`;
                } else {
                    cvList.innerHTML = `<div class="empty-state"><p>Fout bij laden</p></div>`;
                }
            } catch (error) {
                cvList.innerHTML = `<div class="empty-state"><p>Fout bij laden</p></div>`;
            }
        }

        function renderCVs(cvs) {
            const cvList = document.getElementById('cvList');

            if (cvs.length === 0) {
                cvList.innerHTML = `
                    <div class="empty-state">
                        <h2>Geen kandidaten gevonden</h2>
                        <p>Probeer andere zoektermen</p>
                    </div>
                `;
                return;
            }

            cvList.innerHTML = cvs.map(cv => {
                const skills = cv.skills ? cv.skills.split(',').slice(0, 4).map(s => s.trim()) : [];

                return `
                    <div class="cv-card">
                        <div class="cv-name">${escapeHtml(cv.fullName)}</div>
                        <div class="cv-title">${escapeHtml(cv.jobTitle || 'Geen functie opgegeven')}</div>
                        ${cv.fileName ? `<div class="cv-file-badge">📄 CV bestand beschikbaar</div>` : ''}
                        <div class="cv-info">
                            <div class="cv-info-item ${!hasPaid ? 'locked' : ''}">
                                <span>📧</span> ${escapeHtml(cv.email)}
                            </div>
                            <div class="cv-info-item ${!hasPaid ? 'locked' : ''}">
                                <span>📍</span> ${escapeHtml(cv.location || 'Niet opgegeven')}
                            </div>
                        </div>
                        ${skills.length > 0 ? `
                            <div class="cv-skills">
                                ${skills.map(s => `<span class="skill-tag">${escapeHtml(s)}</span>`).join('')}
                            </div>
                        ` : ''}
                        ${cv.summary ? `<div class="cv-summary">${escapeHtml(cv.summary)}</div>` : ''}
                        <div class="cv-actions">
                            <button class="btn btn-view" onclick='viewCV(${JSON.stringify(cv).replace(/'/g, "\\'")})'>Bekijken</button>
                            ${cv.fileName ? (hasPaid ?
                                `<button class="btn btn-download" onclick="downloadCV('${cv._id}')">Download CV</button>` :
                                `<button class="btn btn-locked">🔒 Premium</button>`
                            ) : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function viewCV(cv) {
            document.getElementById('modalName').textContent = cv.fullName;

            let sections = [];

            sections.push({
                title: 'Contact',
                content: `Email: ${cv.email}\nTelefoon: ${cv.phone || '-'}\nLocatie: ${cv.location || '-'}`
            });

            if (cv.summary) {
                sections.push({ title: 'Samenvatting', content: cv.summary });
            }

            if (cv.languages) {
                sections.push({ title: 'Talen', content: cv.languages });
            }

            if (cv.experience) {
                sections.push({ title: 'Werkervaring', content: cv.experience });
            }

            if (cv.education) {
                sections.push({ title: 'Opleiding', content: cv.education });
            }

            if (cv.skills) {
                sections.push({ title: 'Vaardigheden', content: cv.skills });
            }

            if (cv.achievements) {
                sections.push({ title: 'Prestaties', content: cv.achievements });
            }

            document.getElementById('modalBody').innerHTML = sections.map(section => `
                <div class="modal-section">
                    <div class="modal-section-title">${section.title}</div>
                    <div class="modal-section-content">${escapeHtml(section.content)}</div>
                </div>
            `).join('');

            document.getElementById('cvModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('cvModal').classList.remove('active');
        }

        async function downloadCV(id) {
            try {
                const response = await fetch(`/api/employer/cvs/${id}/download`, {
                    headers: { 'X-Employer-Token': authToken }
                });

                if (response.status === 401) {
                    logout();
                    return;
                }

                if (response.status === 403) {
                    alert('Premium account vereist om CV\'s te downloaden');
                    return;
                }

                const result = await response.json();

                if (result.success) {
                    const byteCharacters = atob(result.data.fileData);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) {
                        byteNumbers[i] = byteCharacters.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    const blob = new Blob([byteArray], { type: result.data.fileType });

                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = result.data.fileName;
                    link.click();
                    URL.revokeObjectURL(link.href);
                } else {
                    alert('Fout bij downloaden: ' + result.message);
                }
            } catch (error) {
                alert('Fout bij downloaden');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Enter key for search
        document.querySelectorAll('.search-input').forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchCVs();
            });
        });

        // Close modal
        document.getElementById('cvModal').addEventListener('click', (e) => {
            if (e.target.id === 'cvModal') closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Init
        checkAuth();
    </script>
</body>
</html>
