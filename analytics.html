<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - Jobparsing</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            color: #1a202c;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .header-title {
            color: white;
            font-size: 18px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            align-items: center;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: #667eea;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .date-filters {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }

        .date-input {
            padding: 8px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }

        .date-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .date-label {
            font-size: 13px;
            color: #718096;
        }

        .date-apply-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .date-apply-btn:hover {
            opacity: 0.9;
        }

        .page-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .page-tab {
            padding: 8px 16px;
            border: none;
            background: #e2e8f0;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            color: #4a5568;
        }

        .page-tab:hover {
            background: #cbd5e0;
        }

        .page-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .page-tab .count {
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
            font-size: 11px;
        }

        .page-tab.active .count {
            background: rgba(255,255,255,0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .stat-label {
            font-size: 14px;
            color: #718096;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #1a202c;
        }

        .stat-card.purple .stat-value { color: #667eea; }
        .stat-card.green .stat-value { color: #38a169; }
        .stat-card.blue .stat-value { color: #3182ce; }
        .stat-card.orange .stat-value { color: #dd6b20; }

        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .chart-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2d3748;
        }

        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .table-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .table-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #2d3748;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        .data-table th {
            font-size: 12px;
            font-weight: 600;
            color: #718096;
            text-transform: uppercase;
        }

        .data-table td {
            font-size: 14px;
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        .country-flag {
            font-size: 20px;
            margin-right: 8px;
        }

        .bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #718096;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 1024px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header {
                padding: 16px 20px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .filters {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="logo">Jobparsing</a>
        <span class="header-title">Analytics Dashboard</span>
    </header>

    <div class="container">
        <div class="filters">
            <button class="filter-btn" data-days="7">7 dagen</button>
            <button class="filter-btn active" data-days="30">30 dagen</button>
            <button class="filter-btn" data-days="90">90 dagen</button>
            <button class="filter-btn" data-days="365">1 jaar</button>

            <div class="date-filters">
                <span class="date-label">Van:</span>
                <input type="date" class="date-input" id="dateFrom">
                <input type="text" class="date-input" id="timeFrom" value="00:00" placeholder="00:00" style="width: 80px; text-align: center;" maxlength="5">
                <span class="date-label">Tot:</span>
                <input type="date" class="date-input" id="dateTo">
                <input type="text" class="date-input" id="timeTo" value="23:59" placeholder="23:59" style="width: 80px; text-align: center;" maxlength="5">
                <button class="date-apply-btn" onclick="applyDateRange()">Toepassen</button>
            </div>
        </div>

        <div class="page-tabs" id="pageTabs">
            <button class="page-tab active" data-page="all">Alle pagina's</button>
        </div>

        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Analytics laden...</p>
        </div>

        <div id="dashboard" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card purple">
                    <div class="stat-label">Paginaweergaven</div>
                    <div class="stat-value" id="totalPageviews">0</div>
                </div>
                <div class="stat-card blue">
                    <div class="stat-label">Unieke bezoekers</div>
                    <div class="stat-value" id="uniqueVisitors">0</div>
                </div>
                <div class="stat-card green">
                    <div class="stat-label">CV Submissions</div>
                    <div class="stat-value" id="cvSubmissions">0</div>
                </div>
                <div class="stat-card orange">
                    <div class="stat-label">CV Uploads</div>
                    <div class="stat-value" id="cvUploads">0</div>
                </div>
                <div class="stat-card" style="border-left: 4px solid #38a169;">
                    <div class="stat-label">>80% Matches</div>
                    <div class="stat-value" id="highMatches" style="color: #38a169;">0</div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-card">
                    <h3 class="chart-title">Paginaweergaven over tijd</h3>
                    <canvas id="pageviewsChart"></canvas>
                </div>
                <div class="chart-card">
                    <h3 class="chart-title">CV Methode</h3>
                    <canvas id="cvMethodChart"></canvas>
                </div>
            </div>

            <div class="tables-grid">
                <div class="table-card">
                    <h3 class="table-title">Top Landen</h3>
                    <table class="data-table" id="countriesTable">
                        <thead>
                            <tr>
                                <th>Land</th>
                                <th>Bezoekers</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div class="table-card">
                    <h3 class="table-title">Top Steden</h3>
                    <table class="data-table" id="citiesTable">
                        <thead>
                            <tr>
                                <th>Stad</th>
                                <th>Bezoekers</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div class="table-card">
                    <h3 class="table-title">Top Pagina's</h3>
                    <table class="data-table" id="pagesTable">
                        <thead>
                            <tr>
                                <th>Pagina</th>
                                <th>Weergaven</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div class="table-card">
                    <h3 class="chart-title">Taalgebruik</h3>
                    <canvas id="languageChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let pageviewsChart = null;
        let cvMethodChart = null;
        let languageChart = null;
        let currentDays = 30;
        let currentPage = 'all';
        let fullData = null;
        let customDateRange = null; // { from: 'YYYY-MM-DD', to: 'YYYY-MM-DD' }

        // Auto-format time input (0900 -> 09:00)
        function formatTimeInput(input) {
            input.addEventListener('blur', () => {
                let val = input.value.replace(/[^0-9]/g, ''); // Remove non-digits
                if (val.length === 0) return;

                // Pad to 4 digits if needed
                if (val.length <= 2) {
                    val = val.padStart(2, '0') + '00'; // "9" -> "0900", "12" -> "1200"
                } else if (val.length === 3) {
                    val = '0' + val; // "930" -> "0930"
                } else if (val.length > 4) {
                    val = val.substring(0, 4); // Truncate
                }

                const hours = val.substring(0, 2);
                const minutes = val.substring(2, 4);

                // Validate and clamp values
                const h = Math.min(23, Math.max(0, parseInt(hours, 10) || 0));
                const m = Math.min(59, Math.max(0, parseInt(minutes, 10) || 0));

                input.value = h.toString().padStart(2, '0') + ':' + m.toString().padStart(2, '0');
            });
        }

        // Initialize date inputs
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const thirtyDaysAgo = new Date(today);
            thirtyDaysAgo.setDate(today.getDate() - 30);

            document.getElementById('dateTo').value = today.toISOString().split('T')[0];
            document.getElementById('dateFrom').value = thirtyDaysAgo.toISOString().split('T')[0];

            // Add auto-formatting to time inputs
            formatTimeInput(document.getElementById('timeFrom'));
            formatTimeInput(document.getElementById('timeTo'));
        });

        // Apply custom date range
        function applyDateRange() {
            const fromDate = document.getElementById('dateFrom').value;
            const fromTime = document.getElementById('timeFrom').value || '00:00';
            const toDate = document.getElementById('dateTo').value;
            const toTime = document.getElementById('timeTo').value || '23:59';

            if (!fromDate || !toDate) {
                alert('Selecteer beide datums');
                return;
            }

            // Validate time format (HH:MM)
            const timeRegex = /^([01]?[0-9]|2[0-3]):[0-5][0-9]$/;
            if (!timeRegex.test(fromTime) || !timeRegex.test(toTime)) {
                alert('Gebruik tijd formaat HH:MM (bijv. 09:00 of 17:30)');
                return;
            }

            const from = `${fromDate}T${fromTime}`;
            const to = `${toDate}T${toTime}`;

            if (new Date(from) > new Date(to)) {
                alert('Van-datum/tijd moet voor tot-datum/tijd liggen');
                return;
            }

            // Deactivate preset buttons
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));

            customDateRange = { from, to };
            loadAnalytics(null, from, to);
        }

        // Page name mapping
        const pageNames = {
            '/': 'Home',
            '/index.html': 'Home',
            '/vragenlijst': 'Vragenlijst',
            '/vragenlijst.html': 'Vragenlijst',
            '/werkgevers': 'Werkgevers',
            '/werkgevers.html': 'Werkgevers',
            '/admin': 'Admin',
            '/admin.html': 'Admin',
            '/analytics': 'Analytics',
            '/analytics.html': 'Analytics'
        };

        // Country code to flag emoji
        function countryCodeToFlag(code) {
            if (!code || code === 'LO') return '🏠';
            const codePoints = code
                .toUpperCase()
                .split('')
                .map(char => 127397 + char.charCodeAt());
            return String.fromCodePoint(...codePoints);
        }

        // Format page path
        function formatPage(page) {
            if (!page || page === '/') return 'Home';
            return page.replace(/^\//, '').replace(/\.html$/, '') || 'Home';
        }

        // Load analytics data
        async function loadAnalytics(days, fromDate = null, toDate = null) {
            currentDays = days;
            if (days) customDateRange = null; // Reset custom range when using preset

            document.getElementById('loading').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';

            try {
                let url = '/api/analytics/summary';
                if (fromDate && toDate) {
                    url += `?from=${fromDate}&to=${toDate}`;
                } else {
                    url += `?days=${days}`;
                }
                const response = await fetch(url);
                const result = await response.json();

                if (result.success) {
                    fullData = result.data;
                    buildPageTabs(result.data.pageviewsByPage);
                    renderDashboard(filterDataByPage(result.data, currentPage));
                } else {
                    console.error('Failed to load analytics:', result.error);
                }
            } catch (error) {
                console.error('Error loading analytics:', error);
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
        }

        // Build page tabs from data
        function buildPageTabs(pageData) {
            const container = document.getElementById('pageTabs');
            const totalViews = pageData.reduce((sum, p) => sum + p.count, 0);

            // Group pages by normalized name
            const pageGroups = {};
            pageData.forEach(p => {
                const name = pageNames[p._id] || formatPage(p._id);
                if (!pageGroups[name]) {
                    pageGroups[name] = { pages: [], count: 0 };
                }
                pageGroups[name].pages.push(p._id);
                pageGroups[name].count += p.count;
            });

            let html = `<button class="page-tab ${currentPage === 'all' ? 'active' : ''}" data-page="all">Alle pagina's <span class="count">${totalViews}</span></button>`;

            Object.entries(pageGroups)
                .sort((a, b) => b[1].count - a[1].count)
                .forEach(([name, data]) => {
                    const pageKey = data.pages.join(',');
                    html += `<button class="page-tab ${currentPage === pageKey ? 'active' : ''}" data-page="${pageKey}">${name} <span class="count">${data.count}</span></button>`;
                });

            container.innerHTML = html;

            // Add click handlers
            container.querySelectorAll('.page-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentPage = btn.dataset.page;
                    container.querySelectorAll('.page-tab').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderDashboard(filterDataByPage(fullData, currentPage));
                });
            });
        }

        // Filter data by selected page
        function filterDataByPage(data, page) {
            if (page === 'all') return data;

            const pages = page.split(',');

            return {
                ...data,
                totalPageviews: data.pageviewsByPage
                    .filter(p => pages.includes(p._id))
                    .reduce((sum, p) => sum + p.count, 0),
                dailyPageviews: data.dailyPageviews, // Could filter if backend supports it
                pageviewsByPage: data.pageviewsByPage.filter(p => pages.includes(p._id))
            };
        }

        // Render dashboard with data
        function renderDashboard(data) {
            // Stats
            document.getElementById('totalPageviews').textContent = data.totalPageviews.toLocaleString();
            document.getElementById('uniqueVisitors').textContent = data.uniqueVisitors.toLocaleString();
            document.getElementById('cvSubmissions').textContent = data.cvSubmissions.toLocaleString();
            document.getElementById('cvUploads').textContent = data.cvUploads.toLocaleString();
            document.getElementById('highMatches').textContent = (data.highMatchStats?.totalHighMatches || 0).toLocaleString();

            // Pageviews chart
            renderPageviewsChart(data.dailyPageviews);

            // CV Method chart
            renderCVMethodChart(data.cvUploads, data.cvManual);

            // Language chart
            renderLanguageChart(data.languageUsage);

            // Countries table
            renderTable('countriesTable', data.visitorsByCountry, (item) => ({
                col1: `<span class="country-flag">${countryCodeToFlag(item._id?.code)}</span> ${item._id?.country || 'Onbekend'}`,
                col2: item.count
            }));

            // Cities table
            renderTable('citiesTable', data.visitorsByCity, (item) => ({
                col1: item._id || 'Onbekend',
                col2: item.count
            }));

            // Pages table
            renderTable('pagesTable', data.pageviewsByPage, (item) => ({
                col1: formatPage(item._id),
                col2: item.count
            }));
        }

        // Render pageviews line chart
        function renderPageviewsChart(dailyData) {
            const ctx = document.getElementById('pageviewsChart').getContext('2d');

            if (pageviewsChart) {
                pageviewsChart.destroy();
            }

            pageviewsChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dailyData.map(d => d._id),
                    datasets: [{
                        label: 'Paginaweergaven',
                        data: dailyData.map(d => d.count),
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        // Render CV method doughnut chart
        function renderCVMethodChart(uploads, manual) {
            const ctx = document.getElementById('cvMethodChart').getContext('2d');

            if (cvMethodChart) {
                cvMethodChart.destroy();
            }

            cvMethodChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Upload', 'Vragenlijst'],
                    datasets: [{
                        data: [uploads, manual],
                        backgroundColor: ['#667eea', '#38a169']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        // Render language bar chart
        function renderLanguageChart(languageData) {
            const ctx = document.getElementById('languageChart').getContext('2d');

            if (languageChart) {
                languageChart.destroy();
            }

            const langNames = { nl: 'Nederlands', en: 'English', es: 'Español' };

            languageChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: languageData.map(d => langNames[d._id] || d._id),
                    datasets: [{
                        label: 'Gebruikers',
                        data: languageData.map(d => d.count),
                        backgroundColor: ['#667eea', '#764ba2', '#38a169']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        // Render table
        function renderTable(tableId, data, formatter) {
            const tbody = document.querySelector(`#${tableId} tbody`);
            const maxCount = data.length > 0 ? Math.max(...data.map(d => d.count)) : 1;

            tbody.innerHTML = data.map(item => {
                const formatted = formatter(item);
                const percentage = (item.count / maxCount) * 100;
                return `
                    <tr>
                        <td>${formatted.col1}</td>
                        <td>
                            ${formatted.col2}
                            <div class="bar"><div class="bar-fill" style="width: ${percentage}%"></div></div>
                        </td>
                    </tr>
                `;
            }).join('') || '<tr><td colspan="2">Geen data</td></tr>';
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadAnalytics(parseInt(btn.dataset.days));
            });
        });

        // Initial load
        loadAnalytics(30);
    </script>
</body>
</html>
